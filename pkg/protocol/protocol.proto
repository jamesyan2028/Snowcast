syntax = "proto3";

package protocol;
option go_package = "snowcast-jamesyan2028/pkg/protocol";

message HelloMessage {
    uint32 udp_port = 1;
}

message SetStationMessage {
    uint32 station_number = 1;
    uint32 udp_port = 2;
}

message WelcomeMessage {
    uint32 num_stations = 1;
}

message AnnounceMessage {
    string song_name = 1;
}

message InvalidCommandMessage {
    string reply_string = 1;
}

message DisconnectRequest {
    uint32 udp_port = 2;
}

message DisconnectResponse {
    bool success = 1;
}

message ServerEvent {
    oneof event {
        AnnounceMessage announce = 1;
        InvalidCommandMessage invalid = 2;
    }
}

message HealthRequest {}

message HealthResponse {
    bool ok = 1;
}

service SnowcastControl {
    rpc Handshake(HelloMessage) returns (WelcomeMessage);
    rpc SetStation(SetStationMessage) returns (stream ServerEvent);
    rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
    rpc Health(HealthRequest) returns (HealthResponse);
}

//Following datastructures are stored in WAL

message HandshakeOp {
    string client_ip = 1;
    uint32 udp_port = 2;
}

message SetStationOp {
    string client_ip = 1;
    uint32 udp_port = 2;
    int32 station_number = 3;
    int32 previous_station = 4;
}

message DisconnectOp {
    string client_ip = 1;
    uint32 udp_port = 2;
}

message WalEntry {
    uint64 seq = 1;
    oneof op {
        HandshakeOp handshake = 2;
        SetStationOp set_station = 3;
        DisconnectOp disconnect = 4;
    }
}

message ReplicateRequest {
    WalEntry entry = 1;
}

message ReplicateResponse {
    uint64 seq = 1;
    bool ok = 2;
    string error = 3;
}

message PingRequest {}

message PingResponse {
    uint64 last_wal_seq = 1;
}

service SnowcastReplication {
    rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
    rpc Ping(PingRequest) returns (PingResponse);
}